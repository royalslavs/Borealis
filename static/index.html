<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borealis Proxy</title>
  <style>
    :root { --bg:#05080e; --surface:#0d1117; --surface2:#151b23; --border:#21262d; --text:#e6edf3; --text2:#8b949e; --accent:#5b9bd5; --accent2:#3a7bd5; --glow:rgba(91,155,213,.5); --radius:8px; --transition:.3s cubic-bezier(.23,1,.32,1); }
    *{margin:0;padding:0;box-sizing:border-box} body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
    #particleCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}.bg-gradient{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 50%,rgba(91,155,213,.08) 0%,transparent 70%),radial-gradient(ellipse at 80% 20%,rgba(167,139,250,.06) 0%,transparent 60%);pointer-events:none;z-index:0;animation:bgShift 15s ease-in-out infinite alternate}@keyframes bgShift{0%{transform:scale(1) rotate(0);opacity:.8}100%{transform:scale(1.05) rotate(3deg);opacity:1}}
    .homepage{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;animation:fadeInUp .8s ease}.homepage.hidden{display:none}@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .logo-block{background:rgba(13,17,23,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--radius);padding:1.2rem 2rem;margin-bottom:2.5rem;box-shadow:0 8px 24px rgba(0,0,0,.35)}.logo{font-size:4rem;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(135deg,#6b9fff,#a78bfa,#c084fc,#6b9fff);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientFlow 6s ease infinite;text-align:center;text-shadow:0 0 30px rgba(107,159,255,.15)}@keyframes gradientFlow{0%{background-position:0 center}50%{background-position:100% center}100%{background-position:0 center}}
    .search-container{width:100%;max-width:560px;margin-bottom:2rem;display:flex;background:rgba(13,17,23,.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:var(--radius);padding:0;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:box-shadow var(--transition);overflow:hidden}.search-container:focus-within{box-shadow:0 0 0 3px var(--glow),0 16px 48px rgba(0,0,0,.7)}.search-container input{flex:1;background:transparent;border:none;outline:none;padding:1.1rem 1.5rem;font-size:1.1rem;color:var(--text);font-weight:400;letter-spacing:.3px}.search-container input::placeholder{color:var(--text2);font-weight:300}.search-container button{background:var(--accent2);border:none;color:white;padding:0 1.8rem;cursor:pointer;transition:all var(--transition);font-size:1rem;font-weight:500;border-radius:0;box-shadow:none;display:flex;align-items:center;justify-content:center}.search-container button:hover{background:#4d8fe6}
    .divider-container{width:200px;margin:1rem 0 1.5rem;position:relative;height:2px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}.shooting-star{position:absolute;top:0;left:-50px;width:40px;height:100%;background:linear-gradient(90deg,transparent,rgba(107,159,255,.8),rgba(167,139,250,.4),transparent);filter:blur(2px);animation:shoot 4s ease-in-out infinite}@keyframes shoot{0%{left:-50px;opacity:0}5%{opacity:1}15%{left:100%;opacity:0}100%{left:100%;opacity:0}}
    .tagline{color:var(--text2);font-size:.95rem;font-weight:300;letter-spacing:.8px;opacity:.7;text-shadow:0 0 10px rgba(91,155,213,.2);transition:opacity .3s}.tagline:hover{opacity:1}
    .browser-container{position:relative;z-index:2;width:100%;height:100vh;display:none;flex-direction:row}.browser-container.active{display:flex}.sidebar{width:220px;background:rgba(13,17,23,.9);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;padding:1.8rem 1rem;box-shadow:4px 0 25px rgba(0,0,0,.5)}.sidebar-logo{font-size:1.7rem;font-weight:700;background:linear-gradient(135deg,#6b9fff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2rem;padding-left:.3rem;letter-spacing:-.5px}.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:.3rem}.sidebar-btn{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-radius:var(--radius);color:var(--text2);transition:all var(--transition);cursor:pointer;font-size:.9rem;font-weight:500;background:transparent;border:none;text-align:left;width:100%}.sidebar-btn:hover{background:var(--surface2);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.3);transform:translateX(4px)}.sidebar-footer{margin-top:auto;color:var(--text2);font-size:.7rem;padding:1rem .5rem;border-top:1px solid rgba(255,255,255,.06)}
    .main-area{flex:1;display:flex;flex-direction:column;background:#0a0d14}.toolbar{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;background:rgba(13,17,23,.8);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,.06)}.nav-btns{display:flex;gap:.3rem}.nav-btn{background:transparent;border:none;color:var(--text2);font-size:1.2rem;width:36px;height:36px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition)}.nav-btn:hover{background:var(--surface2);color:var(--accent)}.address-bar{flex:1;display:flex;align-items:center;background:rgba(10,13,20,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--radius);padding:0;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.3)}.address-bar input{flex:1;background:transparent;border:none;outline:none;padding:.55rem 1rem;color:var(--text);font-size:.9rem;font-weight:400}.address-bar input::placeholder{color:var(--text2)}.address-bar .go-btn{background:var(--accent2);border:none;color:white;padding:.55rem 1.5rem;cursor:pointer;transition:all var(--transition);font-weight:500;font-size:.9rem;border-radius:0}.address-bar .go-btn:hover{background:#4d8fe6}
    .content-frame{flex:1;position:relative;background:#05080e}iframe{width:100%;height:100%;border:none;background:white}.progress-bar{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#a78bfa);width:0%;transition:width 1s ease;z-index:10;box-shadow:0 0 12px var(--glow)}.progress-bar.loading{width:80%}.progress-bar.done{width:100%;opacity:0;transition:opacity .3s}.status-bar{display:flex;align-items:center;padding:.4rem 1.2rem;background:rgba(13,17,23,.8);backdrop-filter:blur(15px);border-top:1px solid rgba(255,255,255,.06);font-size:.75rem;color:var(--text2);gap:1rem}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--glow);animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-gradient"></div>
  <canvas id="particleCanvas"></canvas>

  <div class="homepage" id="homepage">
    <div class="logo-block"><div class="logo">Borealis Proxy</div></div>
    <div class="search-container">
      <input type="text" id="homeSearch" placeholder="Search or enter a URL" autofocus />
      <button id="homeGoBtn" aria-label="Go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
    </div>
    <div class="divider-container"><div class="shooting-star"></div></div>
    <p class="tagline">Privacy, clarity, speed.</p>
  </div>

  <div class="browser-container" id="browserContainer">
    <div class="sidebar">
      <div class="sidebar-logo">Borealis</div>
      <div class="sidebar-nav"><button class="sidebar-btn" id="homeBtnSidebar"><span>🏠</span> Home</button></div>
      <div class="sidebar-footer">Borealis Proxy v1</div>
    </div>
    <div class="main-area">
      <div class="toolbar">
        <div class="nav-btns"><button class="nav-btn" id="backBtn" title="Back">←</button><button class="nav-btn" id="forwardBtn" title="Forward">→</button><button class="nav-btn" id="reloadBtn" title="Reload">↻</button></div>
        <div class="address-bar"><input type="text" id="urlInput" placeholder="Search or enter URL" /><button class="go-btn" id="toolbarGoBtn">Go</button></div>
      </div>
      <div class="content-frame" id="contentFrame"><iframe id="frame" src="about:blank"></iframe><div class="progress-bar" id="progressBar"></div></div>
      <div class="status-bar"><span class="status-dot"></span><span id="statusText">Ready</span><span id="statusUrl">—</span></div>
    </div>
  </div>

  <script>
    const canvas=document.getElementById('particleCanvas'); const ctx=canvas.getContext('2d'); let particles=[]; const particleCount=90;
    function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight} window.addEventListener('resize',resizeCanvas); resizeCanvas();
    class Particle{constructor(){this.reset()} reset(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.size=Math.random()*2.5+.5;this.speedX=(Math.random()-.5)*.8;this.speedY=(Math.random()-.5)*.8;this.opacity=Math.random()*.6+.1;this.hue=Math.random()>.7?220+Math.random()*30:250+Math.random()*40} update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<-10||this.x>canvas.width+10||this.y<-10||this.y>canvas.height+10){this.reset();this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height}} draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=`hsla(${this.hue},70%,70%,${this.opacity})`;ctx.fill()}}
    for(let i=0;i<particleCount;i++)particles.push(new Particle()); function animateParticles(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animateParticles)} animateParticles();
  </script>

  <!-- Existing UV frontend assets from Interstellar -->
  <script src="./assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="./assets/mathematics/config.js?v=2025-04-15"></script>
  <script>
    navigator.serviceWorker.register("../sw.js?v=2025-04-15", { scope: "/a/" }).catch(err => console.error("UV service worker registration failed:", err));

    const homepage=document.getElementById('homepage');
    const browserContainer=document.getElementById('browserContainer');
    const homeSearch=document.getElementById('homeSearch');
    const homeGoBtn=document.getElementById('homeGoBtn');
    const urlInput=document.getElementById('urlInput');
    const toolbarGoBtn=document.getElementById('toolbarGoBtn');
    const frame=document.getElementById('frame');
    const backBtn=document.getElementById('backBtn');
    const forwardBtn=document.getElementById('forwardBtn');
    const reloadBtn=document.getElementById('reloadBtn');
    const homeBtnSidebar=document.getElementById('homeBtnSidebar');
    const progressBar=document.getElementById('progressBar');
    const statusText=document.getElementById('statusText');
    const statusUrl=document.getElementById('statusUrl');

    function isUrl(value){return /^https?:\/\//i.test(value)|| (value.includes('.') && !value.startsWith(' '));}
    function normalizeUrl(value){
      let url=value.trim();
      if(!url)return null;
      if(!isUrl(url))return 'https://search.brave.com/search?q='+encodeURIComponent(url);
      if(!/^https?:\/\//i.test(url))url='https://'+url;
      return url;
    }
    function loadUrl(value){
      const url=normalizeUrl(value); if(!url)return;
      const proxyUrl='/a/'+__uv$config.encodeUrl(url);
      homepage.classList.add('hidden'); browserContainer.classList.add('active');
      urlInput.value=url; statusText.textContent='Loading'; statusUrl.textContent=url;
      progressBar.classList.remove('done'); progressBar.classList.add('loading');
      sessionStorage.setItem('GoUrl',proxyUrl);
      frame.src=proxyUrl;
    }
    homeGoBtn.addEventListener('click',()=>loadUrl(homeSearch.value));
    homeSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadUrl(homeSearch.value)}});
    toolbarGoBtn.addEventListener('click',()=>loadUrl(urlInput.value));
    urlInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadUrl(urlInput.value)}});
    backBtn.addEventListener('click',()=>{try{frame.contentWindow.history.back()}catch{}});
    forwardBtn.addEventListener('click',()=>{try{frame.contentWindow.history.forward()}catch{}});
    reloadBtn.addEventListener('click',()=>{try{frame.contentWindow.location.reload()}catch{frame.src=frame.src}});
    homeBtnSidebar.addEventListener('click',()=>{frame.src='about:blank';browserContainer.classList.remove('active');homepage.classList.remove('hidden');urlInput.value='';statusText.textContent='Ready';statusUrl.textContent='—';progressBar.classList.remove('loading','done')});
    frame.addEventListener('load',()=>{progressBar.classList.remove('loading');progressBar.classList.add('done');statusText.textContent='Ready'});
  </script>
</body>
</html>
